name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 語法檢查（所有 js）
        run: |
          for f in ruins/js/*.js; do node --check "$f" || exit 1; done
